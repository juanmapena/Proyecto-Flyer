<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Brush'; src: url(../../mini-pagina/fonts/Mansalva-400.woff2); }
  @font-face { font-family: 'Cond'; font-weight: 700; src: url(../../mini-pagina/fonts/BarlowCondensed-700.woff2); }
  @font-face { font-family: 'Cond'; font-weight: 800; src: url(../../mini-pagina/fonts/BarlowCondensed-800.woff2); }
  @font-face { font-family: 'Barlow'; font-weight: 400; src: url(../../mini-pagina/fonts/b400.woff2); }
  @font-face { font-family: 'Barlow'; font-weight: 500; src: url(../../mini-pagina/fonts/b500.woff2); }
  /* todo se mide en rem = 1% del ancho de la hoja, así sirve igual para A4 y para A6 */
  :root { --cream: #F1E9D8; --red: #C9342A; --red-d: #9E241C; --orange: #EE7A2E; --ink: #3A2620; --muted: #6a5248; --paper: var(--cream); }
  .bn { --cream: #fff; --red: #111; --red-d: #000; --orange: #444; --ink: #111; --muted: #333; --paper: #fff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: var(--W); height: var(--H); overflow: hidden; }
  body { background: var(--paper); color: var(--ink); font-family: 'Barlow'; position: relative; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .brush { font-family: 'Brush'; text-transform: uppercase; transform: skewX(-9deg); -webkit-text-stroke: .12rem currentColor; line-height: .92; }
  .wrap { position: absolute; inset: 0; padding: 9rem 8rem 0; text-align: center; }
  .kicker { font: 800 3.9rem/1 'Cond'; text-transform: uppercase; color: var(--ink); }
  .h { color: var(--red); font-size: 8.6rem; margin-top: 3.4rem; line-height: 1; }
  .swash { display: block; width: 34rem; height: 2.4rem; margin: 2.4rem auto 0; overflow: visible; }
  .swash path { fill: none; stroke: var(--orange); stroke-width: 7; stroke-linecap: round; }
  .sub { font: 400 3.3rem/1.4 'Barlow'; color: var(--muted); margin: 3.6rem auto 0; max-width: 66rem; }
  .sub b { font-weight: 500; color: var(--red-d); }

  .qrzone { position: relative; margin: 6rem auto 0; width: 38rem; }
  .qrcard { background: #fff; border: 1.1rem solid var(--red); border-radius: 4rem; padding: 2.4rem; box-shadow: 0 2rem 4rem -2.5rem rgba(80,30,10,.6); position: relative; z-index: 2; }
  .qrcard svg { display: block; width: 100%; height: auto; }
  .scan { display: inline-block; color: var(--orange); font-size: 5.4rem; margin-top: 3.4rem; transform: rotate(-4deg) skewX(-9deg); white-space: nowrap; }
  .arrow { position: absolute; z-index: 3; left: -10rem; top: 1rem; width: 12rem; height: 16rem; overflow: visible; }
  .arrow path { fill: none; stroke: var(--orange); stroke-width: .9rem; stroke-linecap: round; stroke-linejoin: round; }
  .ph { position: absolute; z-index: 1; width: 19rem; border-radius: 3rem; overflow: hidden; border: .9rem solid var(--ink); background: var(--ink); top: 7rem; }
  .ph img { display: block; width: 100%; aspect-ratio: 390 / 740; object-fit: cover; object-position: top; border-radius: 2.2rem; }
  .ph.l { left: -16rem; transform: rotate(-9deg); }
  .ph.r { right: -16rem; transform: rotate(9deg); }
  .bn .ph { display: none; }

  .contact { position: absolute; left: 7rem; right: 7rem; bottom: 5.6rem; text-align: center; }
  .contact .lbl { font: 800 3.4rem/1 'Cond'; text-transform: uppercase; color: var(--orange); }
  .contact .num { display: inline-flex; align-items: center; gap: 2.4rem; margin-top: 0; padding: 2.4rem 5.4rem; border-radius: 99rem; background: var(--red); color: var(--cream); font: 800 6.6rem/1 'Cond'; }
  .contact .num svg { width: 6.2rem; height: 6.2rem; fill: currentColor; }
  .bn .contact .num { background: #fff; color: #000; border: .8rem solid #000; }
  .contact .who { font: 700 2.9rem/1.2 'Cond'; text-transform: uppercase; color: var(--muted); margin-top: 2.8rem; }
  .sticker { position: absolute; right: -12rem; top: -4.5rem; width: 18rem; height: 18rem; border-radius: 50%; background: var(--paper); border: .9rem solid var(--red); display: grid; place-content: center; text-align: center; transform: rotate(12deg); z-index: 4; box-shadow: 0 1rem 2rem -1.2rem rgba(80,30,10,.5); }
  .sticker .s1 { font: 800 2.6rem/1 'Cond'; color: var(--red); text-transform: uppercase; }
  .sticker .s2 { font-family: 'Brush'; text-transform: uppercase; font-size: 3.6rem; color: var(--orange); transform: skewX(-9deg); line-height: .95; margin: .6rem 0; }
  .sticker .s3 { font: 700 1.9rem/1.1 'Cond'; color: var(--ink); text-transform: uppercase; }
  .spark { position: absolute; color: var(--orange); }
  .spark svg { width: 100%; height: 100%; fill: currentColor; }
</style>
</head>
<body>
  <span class="spark" style="left:6rem;top:6rem;width:5rem;height:5rem"><svg viewBox="0 0 24 24"><path d="M12 0c.6 6 1.8 9.4 12 12-10.2 2.6-11.4 6-12 12-.6-6-1.8-9.4-12-12C10.2 9.4 11.4 6 12 0Z"/></svg></span>
  <div class="wrap">
    <p class="kicker">¿Tenés un emprendimiento o negocio?</p>
    <h1 class="brush h">Escaneá y mirá<br>lo que se<br>puede armar</h1>
    <svg class="swash" viewBox="0 0 320 22"><path d="M3 15 C 70 6, 170 3, 317 9" /></svg>
    <p class="sub"><b>Páginas web a medida</b> y <b>automatizaciones</b><br>para escalar tu negocio.</p>
    <div class="qrzone">
      <div class="ph l"><img src="../../mini-pagina/img/aufore-celu.webp" alt="" /></div>
      <div class="ph r"><img src="../../mini-pagina/img/cyber-celu.webp" alt="" /></div>
      <div class="qrcard" id="qr"></div>
      <div class="sticker"><span class="s1">Promo</span><span class="s2">Black<br>Friday</span><span class="s3">Por tiempo<br>limitado</span></div>
    </div>
    <p class="brush scan">¡Escaneame!</p>
  </div>
  <div class="contact">
    <p class="num"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2s.2-1.1.2-1.2-.2-.2-.4-.3Z"/></svg><span id="tel"></span></p>
    <p class="who">Juan Manuel Pena · Webs &amp; automatizaciones</p>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  const W = +(q.get('w') || 794), H = Math.round(W * 297 / 210);
  document.documentElement.style.setProperty('--W', W + 'px');
  document.documentElement.style.setProperty('--H', H + 'px');
  document.documentElement.style.fontSize = (W / 100) + 'px';
  if (q.get('bn')) document.documentElement.classList.add('bn');
  document.getElementById('tel').textContent = q.get('tel') || '+54 9 11 5052-7336';
  fetch(q.get('bn') ? 'qr-bn.svg' : 'qr.svg').then(r => r.text()).then(t => { document.getElementById('qr').innerHTML = t; document.body.dataset.ok = 1; });
</script>
</body>
</html>
